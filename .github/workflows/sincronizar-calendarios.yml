name: Sincronizar calendários

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Gravar as alterações? Deixe desmarcado para apenas testar.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sincronizar-calendarios
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependência
        run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - name: Sincronizar
        env:
          ICAL_FEEDS: ${{ secrets.ICAL_FEEDS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APLICAR: ${{ github.event_name == 'workflow_dispatch' && inputs.aplicar || github.event_name == 'schedule' && vars.SINCRONIZACAO_ATIVA == 'true' }}
          EXPORTAR_CALENDARIOS: ${{ vars.EXPORTAR_CALENDARIOS }}
        run: node scripts/sincronizar-calendarios.mjs
      - name: Publicar calendários para as plataformas
        if: ${{ always() && (github.event_name == 'workflow_dispatch' && inputs.aplicar || github.event_name == 'schedule' && vars.SINCRONIZACAO_ATIVA == 'true') && hashFiles('saida-calendarios/*.ics') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd saida-calendarios
          git init -q
          git checkout -q -b calendarios
          git add *.ics
          git -c user.name="casas-na-praia" -c user.email="actions@users.noreply.github.com" commit -q -m "Atualiza calendários"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" calendarios
          echo "Links publicados:"
          for f in *.ics; do echo "  https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/calendarios/$f"; done
