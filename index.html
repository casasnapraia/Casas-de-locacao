<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casas na Praia - Disponibilidade e Reservas</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{
 --marinho:#0a4b6e;
 --marinho2:#063b57;
 --turquesa:#17a2b8;
 --turquesa2:#0e8196;
 --areia:#f8f5e6;
 --ouro:#ffc107;
 --ouro2:#e0aa00;
 --concha:#fff8e7;
 --texto:#2c3e50;
 --claro:#555;
 --borda:#ddd;
 --sombra:rgba(0,0,0,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;color:var(--texto);background:linear-gradient(120deg,#e0f2f7,var(--areia));min-height:100vh;}
.cabecalho{background:linear-gradient(90deg,var(--marinho),var(--turquesa));color:white;padding:1.2rem;text-align:center;box-shadow:0 3px 10px var(--sombra);}
.cabecalho h1{font-size:1.6rem;margin-bottom:.3rem;}
.cabecalho p{opacity:.9;}
.conteudo{max-width:1200px;margin:0 auto;padding:1.5rem;}
.painel{display:flex;gap:2rem;flex-wrap:wrap;}
.coluna-login{flex:0 0 320px;}
.coluna-publica{flex:1;min-width:320px;}
.card{background:white;border-radius:14px;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 4px 12px var(--sombra);}
.card h2{color:var(--marinho);margin-bottom:1rem;border-bottom:2px solid var(--areia);padding-bottom:.5rem;}
.grupo{margin-bottom:1rem;}
label{display:block;margin-bottom:.4rem;font-weight:500;}
input,select,textarea,button{width:100%;padding:.75rem;border:1px solid var(--borda);border-radius:8px;font-size:1rem;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--turquesa);box-shadow:0 0 0 3px rgba(23,162,184,.2);}
button{background:var(--turquesa);color:white;border:none;cursor:pointer;font-weight:600;transition:.2s;}
button:hover{background:var(--turquesa2);}
button.secundario{background:var(--areia);color:var(--texto);}
button.secundario:hover{background:#f0e9d0;}
button.sucesso{background:#28a745;}
button.sucesso:hover{background:#218838;}
button.perigo{background:#dc3545;}
button.perigo:hover{background:#c82333;}
.aviso{padding:.85rem;border-radius:8px;margin:1rem 0;}
.aviso.sucesso{background:#d4edda;color:#155724;border:1px solid #c3e6cb;}
.aviso.erro{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;}
.aviso.info{background:#d1ecf1;color:#0c5460;border:1px solid #bee5eb;}
.casa{border:1px solid var(--borda);border-radius:12px;padding:1rem;margin-bottom:1rem;transition:.2s;}
.casa:hover{border-color:var(--turquesa);box-shadow:0 2px 8px var(--sombra);}
.casa h3{color:var(--marinho);margin-bottom:.5rem;}
.foto-principal{width:100%;height:200px;object-fit:cover;border-radius:10px;margin:.8rem 0;}
.destaque{background:var(--areia);border-left:4px solid var(--ouro);padding:.8rem;border-radius:0 8px 8px 0;margin:.8rem 0;}
.etiqueta{display:inline-block;padding:.25rem .6rem;border-radius:20px;font-size:.85rem;font-weight:600;margin-right:.4rem;}
.etiqueta.disponivel{background:#d4edda;color:#155724;}
.etiqueta.ocupada{background:#f8d7da;color:#721c24;}
.galeria-mini{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem;}
.galeria-mini img{width:70px;height:70px;object-fit:cover;border-radius:6px;cursor:pointer;transition:.2s;}
.galeria-mini img:hover{opacity:.8;transform:scale(1.05);}
.calendario{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.dia{aspect-ratio:1;text-align:center;padding:.4rem;border-radius:6px;cursor:pointer;font-size:.9rem;}
.dia.disponivel{background:#e8f5e9;}
.dia.ocupada{background:#ffebee;color:#b71c1c;cursor:not-allowed;}
.dia.selecionado{background:var(--turquesa);color:white;font-weight:bold;}
.aba{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;}
.aba button{flex:1;min-width:100px;}
.aba button.ativo{background:var(--marinho);}
.oculto{display:none !important;}
.notificacao{position:fixed;top:15px;right:15px;background:white;border-left:4px solid var(--ouro);padding:1rem 1.2rem;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.15);z-index:9999;max-width:320px;animation:deslizar .3s ease-out;}
@keyframes deslizar{from{transform:translateX(100%);opacity:0;}to{transform:none;opacity:1;}}
.sino{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--ouro);color:white;font-weight:bold;margin-right:.5rem;}
.badge{background:red;color:white;border-radius:50%;font-size:.7rem;padding:.1rem .4rem;position:relative;top:-8px;left:-8px;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9998;}
.modal-conteudo{background:white;border-radius:14px;padding:2rem;max-width:500px;width:90%;max-height:90vh;overflow-y:auto;}
@media(max-width:768px){
 .conteudo{padding:1rem;}
 .coluna-login{flex:none;width:100%;}
 .dia{padding:.2rem;font-size:.8rem;}
}
</style>
</head>
<body>

<header class="cabecalho">
  <h1>🏖️ Casas na Praia</h1>
  <p>Araranguá / SC — Reservas e Disponibilidade</p>
</header>

<main class="conteudo">
  <div class="painel">

    <!-- COLUNA ESQUERDA: LOGIN ADMIN -->
    <div class="coluna-login">
      <div class="card" id="area-login">
        <h2>🔐 Administração</h2>
        <div id="aviso-login"></div>
        <div class="grupo">
          <label>E-mail</label>
          <input type="email" id="admin-email" placeholder="seuemail@email.com">
        </div>
        <div class="grupo">
          <label>Senha</label>
          <input type="password" id="admin-senha" placeholder="••••••••">
        </div>
        <button onclick="entrarAdmin()">Entrar</button>
      </div>

      <div class="card oculto" id="area-admin">
        <h2>Painel Administrativo <span class="sino" id="icone-sino">🔔</span><span class="badge oculto" id="badge-qtd">0</span></h2>
        
        <div class="aba">
          <button class="ativo" onclick="mostrarAba('reservas')">Solicitações</button>
          <button onclick="mostrarAba('casas')">Casas</button>
          <button onclick="mostrarAba('hospedes')">Hóspedes</button>
          <button onclick="mostrarAba('relatorios')">Relatórios</button>
          <button class="perigo" onclick="sairAdmin()">Sair</button>
        </div>

        <!-- ABA: SOLICITAÇÕES -->
        <div id="aba-reservas">
          <h3>Solicitações de Reserva</h3>
          <div id="lista-solicitacoes"></div>
        </div>

        <!-- ABA: CASAS -->
        <div id="aba-casas" class="oculto">
          <h3>Editar Casas e Valores</h3>
          <div id="lista-casas-admin"></div>
        </div>

        <!-- ABA: HÓSPEDES -->
        <div id="aba-hospedes" class="oculto">
          <h3>Cadastro de Hóspedes</h3>
          <div class="grupo">
            <input type="text" id="buscar-hospede" placeholder="Buscar por nome..." oninput="filtrarHospedes()">
          </div>
          <div id="lista-hospedes"></div>
        </div>

        <!-- ABA: RELATÓRIOS -->
        <div id="aba-relatorios" class="oculto">
          <h3>Relatório de Recebimentos</h3>
          <div class="grupo" style="display:flex;gap:.5rem;flex-wrap:wrap;">
            <input type="date" id="relatorio-inicio">
            <input type="date" id="relatorio-fim">
            <button onclick="gerarRelatorio()">Gerar</button>
          </div>
          <div id="resultado-relatorio"></div>
        </div>
      </div>
    </div>

    <!-- COLUNA DIREITA: ÁREA PÚBLICA -->
    <div class="coluna-publica">
      <div class="card">
        <h2>🏡 Casas Disponíveis</h2>
        <p style="margin-bottom:1rem;color:var(--claro);">Escolha uma casa, consulte as datas e faça sua solicitação</p>
        <div id="lista-casas-publicas"></div>
      </div>
    </div>

  </div>
</main>

<!-- MODAL GALERIA -->
<div class="modal oculto" id="modal-galeria" onclick="fecharModalGaleria(event)">
  <div class="modal-conteudo" onclick="event.stopPropagation()">
    <h3 id="titulo-galeria"></h3>
    <div id="fotos-galeria" style="display:flex;flex-wrap:wrap;gap:.8rem;margin:1rem 0;"></div>
    <button class="secundario" onclick="fecharModalGaleria()">Fechar</button>
  </div>
</div>

<script>
// ========== CONFIGURAÇÃO FIREBASE ==========
const firebaseConfig = {
  apiKey: "AIzaSyC9DqV2ZtXz9hK78xXz9hK78xXz9hK78xXz9hK78",
  authDomain: "casas-na-praia.firebaseapp.com",
  projectId: "casas-na-praia",
  storageBucket: "casas-na-praia.appspot.com",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abc123def456ghi789jkl01"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// ========== DADOS DAS CASAS ==========
const casas = {
  amarela: {
    nome: "Casa Amarela",
    descricao: "3 quartos, 2 banheiros e meio, espaço gourmet com churrasqueira e mesa de sinuca, garagem coberta para 3 carros — a poucos passos da praia.",
    capacidadeMax: 10,
    foto: "",
    galeria: [],
    taxaLimpeza: 0
  },
  beje: {
    nome: "Casa Bege",
    descricao: "2 quartos, 2 banheiros, espaço gourmet com churrasqueira e mesa de sinuca, pátio fechado — a poucos passos da praia.",
    capacidadeMax: 8,
    foto: "",
    galeria: [],
    taxaLimpeza: 0
  },
  marrom: {
    nome: "Casa Marrom",
    descricao: "3 quartos, 2 banheiros, espaço gourmet com churrasqueira e mesa de sinuca, pátio fechado — a poucos passos da praia.",
    capacidadeMax: 10,
    foto: "",
    galeria: [],
    taxaLimpeza: 0
  },
  branca: {
    nome: "Casa Branca",
    descricao: "3 quartos, 2 banheiros e meio, espaço gourmet com churrasqueira e mesa de sinuca, garagem coberta para 3 carros — a poucos passos da praia.",
    capacidadeMax: 10,
    foto: "",
    galeria: [],
    taxaLimpeza: 0
  }
};

let usuarioLogado = null;
let solicitacoesNovas = 0;

// ========== AUTENTICAÇÃO ==========
async function entrarAdmin(){
  const email = document.getElementById('admin-email').value;
  const senha = document.getElementById('admin-senha').value;
  const aviso = document.getElementById('aviso-login');
  try{
    await auth.signInWithEmailAndPassword(email, senha);
    aviso.innerHTML = `<div class="aviso sucesso">✅ Entrando...</div>`;
  }catch(e){
    aviso.innerHTML = `<div class="aviso erro">❌ ${e.message}</div>`;
  }
}

function sairAdmin(){
  auth.signOut();
}

auth.onAuthStateChanged(user=>{
  usuarioLogado = user;
  if(user){
    document.getElementById('area-login').classList.add('oculto');
    document.getElementById('area-admin').classList.remove('oculto');
    carregarTudo();
    iniciarEscutaNovasReservas();
  }else{
    document.getElementById('area-login').classList.remove('oculto');
    document.getElementById('area-admin').classList.add('oculto');
    solicitacoesNovas = 0;
    atualizarBadge();
  }
});

// ========== NOTIFICAÇÕES ==========
function iniciarEscutaNovasReservas(){
  db.collection('solicitacoes').where('status','==','nova').onSnapshot(snap=>{
    snap.docChanges().forEach(change=>{
      if(change.type==='added' && usuarioLogado){
        const dados = change.doc.data();
        solicitacoesNovas++;
        atualizarBadge();
        mostrarNotificacao(`📩 Nova solicitação: ${dados.nomeHospede} — ${dados.casaNome}`);
      }
    });
  });
}

function mostrarNotificacao(mensagem){
  const notif = document.createElement('div');
  notif.className = 'notificacao';
  notif.innerHTML = `<strong>🔔 Nova Reserva!</strong><p style="margin:.3rem 0 0 0;font-size:.9rem;">${mensagem}</p>`;
  document.body.appendChild(notif);
  setTimeout(()=>notif.remove(),6000);
  
  if('Notification' in window && Notification.permission==='granted'){
    new Notification('Nova Solicitação de Reserva',{body:mensagem,icon:'https://i.imgur.com/7ZbKxL9.png'});
  }
}

function atualizarBadge(){
  const badge = document.getElementById('badge-qtd');
  badge.textContent = solicitacoesNovas;
  badge.classList.toggle('oculto', solicitacoesNovas===0);
}

if('Notification' in window && Notification.permission==='default'){
  Notification.requestPermission();
}

// ========== FUNÇÕES GERAIS ==========
function mostrarAba(nome){
  document.querySelectorAll('[id^="aba-"]').forEach(el=>el.classList.add('oculto'));
  document.getElementById(`aba-${nome}`).classList.remove('oculto');
  document.querySelectorAll('.aba button').forEach(b=>b.classList.remove('ativo'));
  event.target.classList.add('ativo');
  solicitacoesNovas = 0;
  atualizarBadge();
}

function carregarTudo(){
  carregarCasasPublico();
  carregarCasasAdmin();
  carregarSolicitacoes();
  carregarHospedes();
}

function carregarCasasPublico(){
  const container = document.getElementById('lista-casas-publicas');
  container.innerHTML = '';
  
  Object.entries(casas).forEach(([id,casa])=>{
    const div = document.createElement('div');
    div.className = 'casa';
    div.innerHTML = `
      <h3>${casa.nome}</h3>
      ${casa.foto ? `<img src="${casa.foto}" class="foto-principal" alt="${casa.nome}">` : ''}
      <p>${casa.descricao}</p>
      <div class="destaque">
        <strong>Capacidade:</strong> até ${casa.capacidadeMax} pessoas<br>
        <em>Valores calculados após selecionar as datas</em>
      </div>
      ${casa.galeria?.length ? `<button class="secundario" style="margin:.5rem 0;" onclick="abrirGaleria('${id}')">📷 Ver Galeria (${casa.galeria.length} fotos)</button>` : ''}
      
      <h4 style="margin:1rem 0 .5rem;">Calendário — selecione os dias</h4>
      <div class="calendario" id="calendario-${id}"></div>
      <p id="msg-status-${id}" style="margin:.5rem 0;"></p>
      
      <div id="form-reserva-${id}" class="oculto" style="margin-top:1rem;">
        <div class="grupo">
          <label>Adultos</label>
          <input type="number" id="adultos-${id}" min="1" max="${casa.capacidadeMax}" value="1">
        </div>
        <div class="grupo">
          <label>Crianças</label>
          <input type="number" id="criancas-${id}" min="0" max="${casa.capacidadeMax}" value="0">
        </div>
        <div class="grupo">
          <label>Nome completo</label>
          <input type="text" id="nome-${id}" required>
        </div>
        <div class="grupo">
          <label>Telefone / WhatsApp</label>
          <input type="tel" id="fone-${id}" required>
        </div>
        <div class="grupo">
          <label>E-mail</label>
          <input type="email" id="email-${id}">
        </div>
        <div class="grupo">
          <label>Observações</label>
          <textarea id="obs-${id}" rows="2" placeholder="Se exceder a capacidade de ${casa.capacidadeMax} pessoas, informe aqui."></textarea>
        </div>
        <div id="resumo-valor-${id}" style="background:#e8f4f8;padding:.8rem;border-radius:8px;margin:.8rem 0;"></div>
        <button onclick="enviarReserva('${id}')">📤 Enviar Solicitação</button>
      </div>
    `;
    container.appendChild(div);
    inicializarCalendario(id);
  });
}

function inicializarCalendario(idCasa){
  const agora = new Date();
  const ano = agora.getFullYear(), mes = agora.getMonth();
  const container = document.getElementById(`calendario-${idCasa}`);
  container.innerHTML = '';
  
  const diasSemana = ['D','S','T','Q','Q','S','S'];
  diasSemana.forEach(d=>{
    const el = document.createElement('div');
    el.style.fontWeight='bold';el.style.textAlign='center';el.textContent=d;
    container.appendChild(el);
  });
  
  const primeiroDia = new Date(ano,mes,1).getDay();
  const ultimoDia = new Date(ano,mes+1,0).getDate();
  
  for(let i=0;i<primeiroDia;i++){
    const vazio = document.createElement('div');
    container.appendChild(vazio);
  }
  
  let datasSelecionadas = [];
  const hoje = Date.now();
  
  for(let dia=1;dia<=ultimoDia;dia++){
    const dataAtual = new Date(ano,mes,dia);
    const timestamp = dataAtual.setHours(0,0,0,0);
    const el = document.createElement('div');
    el.className = 'dia';
    el.textContent = dia;
    
    if(timestamp < hoje){
      el.style.opacity='.3';el.style.cursor='not-allowed';
    }else{
      el.classList.add('disponivel');
      el.onclick = ()=>{
        if(datasSelecionadas.includes(dia)){
          datasSelecionadas = datasSelecionadas.filter(d=>d!==dia);
          el.classList.remove('selecionado');
        }else{
          datasSelecionadas.push(dia);
          el.classList.add('selecionado');
        }
        
        if(datasSelecionadas.length>0){
          datasSelecionadas.sort((a,b)=>a-b);
          const inicio = new Date(ano,mes,datasSelecionadas[0]);
          const fim = new Date(ano,mes,datasSelecionadas.at(-1));
          const qtdDias = Math.ceil((fim - inicio)/(1000*60*60*24)) + 1;
          
          document.getElementById(`form-reserva-${idCasa}`).classList.remove('oculto');
          document.getElementById(`msg-status-${idCasa}`).innerHTML = 
            `<span style="color:green">✅ ${qtdDias} dia(s) selecionado(s)</span>`;
          
          const casa = casas[idCasa];
          const valorTotal = qtdDias * 150 + casa.taxaLimpeza;
          document.getElementById(`resumo-valor-${idCasa}`).innerHTML = `
            <strong>Resumo:</strong><br>
            ${qtdDias} diárias × R$ 150,00 (exemplo) = R$ ${(qtdDias*150).toFixed(2)}<br>
            Taxa de limpeza: R$ ${casa.taxaLimpeza.toFixed(2)}<br>
            <strong>Total: R$ ${valorTotal.toFixed(2)}</strong>
          `;
        }else{
          document.getElementById(`form-reserva-${idCasa}`).classList.add('oculto');
          document.getElementById(`msg-status-${idCasa}`).textContent = '';
        }
      };
    }
    container.appendChild(el);
  }
}

async function enviarReserva(idCasa){
  const casa = casas[idCasa];
  const adultos = parseInt(document.getElementById(`adultos-${idCasa}`).value)||0;
  const criancas = parseInt(document.getElementById(`criancas-${idCasa}`).value)||0;
  const totalPessoas = adultos + criancas;
  
  if(totalPessoas > casa.capacidadeMax){
    alert(`⚠️ Esta casa comporta no máximo ${casa.capacidadeMax} pessoas. Se mesmo assim deseja solicitar, confirme no campo de observações.`);
  }
  
  const dados = {
    casaId: idCasa,
    casaNome: casa.nome,
    adultos, criancas, totalPessoas,
    nomeHospede: document.getElementById(`nome-${idCasa}`).value.trim(),
    telefone: document.getElementById(`fone-${idCasa}`).value.trim(),
    email: document.getElementById(`email-${idCasa}`).value.trim(),
    observacoes: document.getElementById(`obs-${idCasa}`).value.trim(),
    status: 'nova',
    dataCriacao: new Date()
  };
  
  if(!dados.nomeHospede || !dados.telefone){
    alert('Preencha nome e telefone!');return;
  }
  
  await db.collection('solicitacoes').add(dados);
  
  // Salva/atualiza hóspede
  const refHospede = await db.collection('hospedes').where('telefone','==',dados.telefone).get();
  if(refHospede.empty){
    await db.collection('hospedes').add({
      nome: dados.nomeHospede,
      telefone: dados.telefone,
      email: dados.email,
      dataCadastro: new Date()
    });
  }
  
  alert('✅ Solicitação enviada com sucesso! Avisaremos em breve.');
  carregarCasasPublico();
}

function abrirGaleria(idCasa){
  const casa = casas[idCasa];
  document.getElementById('titulo-galeria').textContent = `Galeria — ${casa.nome}`;
  const container = document.getElementById('fotos-galeria');
  container.innerHTML = '';
  casa.galeria.forEach(foto=>{
    const img = document.createElement('img');
    img.src = foto;
    img.style.width='150px';img.style.height='150px';img.style.objectFit='cover';img.style.borderRadius='8px';
    container.appendChild(img);
  });
  document.getElementById('modal-galeria').classList.remove('oculto');
}

function fecharModalGaleria(e){
  if(!e || e.target.id==='modal-galeria'){
    document.getElementById('modal-galeria').classList.add('oculto');
  }
}

function carregarCasasAdmin(){
  const container = document.getElementById('lista-casas-admin');
  container.innerHTML = '';
  Object.entries(casas).forEach(([id,casa])=>{
    const div = document.createElement('div');
    div.className = 'casa';
    div.innerHTML = `
      <h4>${casa.nome}</h4>
      <div class="grupo">
        <label>URL Foto Principal (Imgur)</label>
        <input type="url" id="foto-princ-${id}" value="${casa.foto}" placeholder="https://i.imgur.com/xxxx.jpg">
      </div>
      <div class="grupo">
        <label>Taxa de Limpeza (R$)</label>
        <input type="number" id="limpeza-${id}" value="${casa.taxaLimpeza}" step="0.01">
      </div>
      <div class="grupo">
        <label>Adicionar foto à galeria (Imgur)</label>
        <input type="url" id="foto-galeria-${id}" placeholder="https://i.imgur.com/xxxx.jpg">
      </div>
      <button class="secundario" onclick="adicionarGaleria('${id}')">Adicionar à Galeria</button>
      <p style="margin:.5rem 0;font-size:.9rem;">Fotos na galeria: ${casa.galeria.length}</p>
      <button onclick="salvarCasa('${id}')">Salvar Casa</button>
    `;
    container.appendChild(div);
  });
}

function salvarCasa(id){
  const foto = document.getElementById(`foto-princ-${id}`).value.trim();
  const limpeza = parseFloat(document.getElementById(`limpeza-${id}`).value)||0;
  casas[id].foto = foto;
  casas[id].taxaLimpeza = limpeza;
  localStorage.setItem('casasDados', JSON.stringify(casas));
  alert('✅ Salvo!');
  carregarCasasPublico();
}

function adicionarGaleria(id){
  const url = document.getElementById(`foto-galeria-${id}`).value.trim();
  if(url){
    casas[id].galeria.push(url);
    localStorage.setItem('casasDados', JSON.stringify(casas));
    alert('✅ Adicionado!');
    carregarCasasPublico();
    carregarCasasAdmin();
  }
}

function carregarSolicitacoes(){
  db.collection('solicitacoes').orderBy('dataCriacao','desc').onSnapshot(snap=>{
    const container = document.getElementById('lista-solicitacoes');
    container.innerHTML = '';
    if(snap.empty){
      container.innerHTML = '<p style="color:#88;">Nenhuma solicitação recebida.</p>';
      return;
    }
    snap.forEach(doc=>{
      const s = doc.data();
      const etiq = s.status==='nova' ? 'nova' : s.status;
      const cor = s.status==='nova' ? 'style="background:#fff3cd;color:#856404;"' : '';
      container.innerHTML += `
        <div style="border:1px solid #ddd;border-radius:8px;padding:1rem;margin-bottom:.8rem;">
          <span class="etiqueta" ${cor}>${etiq}</span>
          <h4>${s.casaNome}</h4>
          <p><strong>${s.nomeHospede}</strong><br>
          ${s.telefone} | ${s.email || 'sem e-mail'}<br>
          ${s.totalPessoas} pessoa(s)</p>
          ${s.observacoes ? `<p style="font-style:italic;color:#666;">Obs: ${s.observacoes}</p>` : ''}
          <button class="sucesso" style="margin:.3rem;" onclick="confirmarReserva('${doc.id}')">✅ Confirmar Reserva</button>
          <button class="secundario" style="margin:.3rem;" onclick="marcarPendente('${doc.id}')">⏳ Pendente</button>
          <button class="perigo" style="margin:.3rem;" onclick="excluirSolicitacao('${doc.id}')">🗑️ Excluir</button>
        </div>
      `;
    });
  });
}

async function confirmarReserva(id){
  await db.collection('solicitacoes').doc(id).update({status:'confirmada'});
  alert('✅ Reserva confirmada e data bloqueada!');
}
async function marcarPendente(id){
  await db.collection('solicitacoes').doc(id).update({status:'pendente'});
}
async function excluirSolicitacao(id){
  if(confirm('Tem certeza?')){
    await db.collection('solicitacoes').doc(id).delete();
  }
}

function carregarHospedes(){
  db.collection('hospedes').orderBy('nome').onSnapshot(snap=>{
    const todos = [];
    snap.forEach(d=>todos.push({id:d.id,...d.data()}));
    window.listaHospedes = todos;
    filtrarHospedes();
  });
}

function filtrarHospedes(){
  const busca = (document.getElementById('buscar-hospede')?.value||'').toLowerCase();
  const container = document.getElementById('lista-hospedes');
  container.innerHTML = '';
  (window.listaHospedes||[]).filter(h=>h.nome.toLowerCase().includes(busca) || h.telefone.includes(busca)).forEach(h=>{
    container.innerHTML += `
      <div style="border-bottom:1px solid #eee;padding:.6rem 0;">
        <strong>${h.nome}</strong><br>
        📞 ${h.telefone} | 📧 ${h.email || '-'}
      </div>
    `;
  });
}

function gerarRelatorio(){
  alert('Relatório — em desenvolvimento!');
}

// Carregar dados salvos
const salvos = localStorage.getItem('casasDados');
if(salvos){
  try{
    const dados = JSON.parse(salvos);
    Object.keys(dados).forEach(id=>{
      if(casas[id]) Object.assign(casas[id], dados[id]);
    });
  }catch(e){}
}

carregarCasasPublico();
</script>
