<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Casas na Praia - Balneário Arroio do Silva/SC</title>
 <style>
  :root {
   --primaria: #0a4b6e;
   --secundaria: #17a2b8;
   --sucesso: #28a745;
   --perigo: #dc3545;
   --cinza: #6c757d;
   --fundo: #f4f6f8;
  }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--fundo); margin: 0; padding: 20px; color: #333; }
  .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
  
  /* Cabeçalho e Abas */
  .cabecalho { text-align: center; border-bottom: 2px solid var(--primaria); padding-bottom: 15px; margin-bottom: 20px; }
  .cabecalho h1 { color: var(--primaria); margin: 0; font-size: 28px; }
  .cabecalho p { color: var(--cinza); margin: 5px 0 0 0; }
  
  .nav-tabs { display: flex; gap: 10px; border-bottom: 1px solid #ddd; margin-bottom: 25px; }
  .nav-tab { padding: 10px 20px; cursor: pointer; border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0; font-weight: bold; color: var(--primaria); }
  .nav-tab.ativa { background: var(--primaria); color: #fff; }
  
  .aba-conteudo { display: none; }
  .aba-conteudo.ativa { display: block; }

  /* Elementos Gerais */
  .grupo-input { margin-bottom: 15px; }
  .grupo-input label { display: block; margin-bottom: 5px; font-weight: bold; }
  .grupo-input input, .grupo-input select, .grupo-input textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  .linha-form { display: flex; gap: 10px; }
  
  button { padding: 10px 18px; border: none; border-radius: 6px; background: var(--primaria); color: #fff; cursor: pointer; font-weight: bold; transition: background 0.2s; }
  button:hover { opacity: 0.9; }
  button:disabled { background: var(--cinza) !important; cursor: not-allowed; }
  button.sucesso { background: var(--sucesso); }
  button.vermelho { background: var(--perigo); }

  /* Modais e Tabelas */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
  .modal.aberto { display: flex; }
  .modal-conteudo { background: #fff; padding: 25px; border-radius: 8px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
  
  .tabela-relatorio { width: 100%; border-collapse: collapse; margin-top: 15px; }
  .tabela-relatorio th, .tabela-relatorio td { border: 1px solid #e1e8ed; padding: 10px; text-align: left; }
  .tabela-relatorio th { background: #f8f9fa; color: var(--primaria); }
  
  .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; color: #fff; text-transform: uppercase; }
  .status-pago { background: var(--sucesso); }
  .status-parcial { background: #ffc107; color: #000; }
  .status-pendente { background: var(--perigo); }
  .status-confirmada { background: var(--secundaria); }

  .relatorio-resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
  .resumo-card { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #e1e8ed; }
  .resumo-card small { display: block; color: var(--cinza); margin-bottom: 5px; font-weight: 500; }
  .resumo-card strong { font-size: 20px; }
 </style>

 <!-- SDKs do Firebase (v8) -->
 <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
 <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

<div class="container">
 <div class="cabecalho">
  <h1>🏖️ Casas na Praia</h1>
  <p>Balneário Arroio do Silva / SC</p>
 </div>

 <!-- NAVEGAÇÃO ENTRE ÁREA PÚBLICA E ADMIN -->
 <div class="nav-tabs">
  <div class="nav-tab ativa" onclick="mudarAba('publico')">📅 Reservas & Calendário</div>
  <div class="nav-tab" onclick="mudarAba('admin')">⚙️ Painel Administrativo</div>
 </div>

 <!-- =====================================================
      ÁREA PÚBLICA (CALENDÁRIO E VITRINE)
 ===================================================== -->
 <div id="aba-publico" class="aba-conteudo ativa">
  <h2>Solicitar Reserva</h2>
  <p style="color: var(--cinza);">Consulte a disponibilidade e selecione o período desejado.</p>
  
  <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e1e8ed; margin-top: 15px;">
   <div class="grupo-input">
    <label>Acomodação</label>
    <select id="pubCasa">
     <option value="casa1">Casa 1</option>
     <option value="casa2">Casa 2</option>
    </select>
   </div>
   <div class="linha-form">
    <div class="grupo-input" style="flex:1;">
     <label>Entrada (Check-in)</label>
     <input type="date" id="pubEntrada">
    </div>
    <div class="grupo-input" style="flex:1;">
     <label>Saída (Check-out)</label>
     <input type="date" id="pubSaida">
    </div>
   </div>
   <div class="grupo-input">
    <label>Seu Nome Completo</label>
    <input type="text" id="pubNome" placeholder="Digite seu nome">
   </div>
   <div class="grupo-input">
    <label>Telefone / WhatsApp</label>
    <input type="tel" id="pubTelefone" placeholder="(48) 99999-9999">
   </div>
   <button class="sucesso" style="width: 100%; padding: 12px; font-size: 16px;" onclick="enviarSolicitacaoPublica()">📲 Enviar Pedido de Reserva</button>
  </div>
 </div>

 <!-- =====================================================
      ÁREA ADMINISTRATIVA (GESTOR)
 ===================================================== -->
 <div id="aba-admin" class="aba-conteudo">
  <h2>Gestão Financeira & Relatórios</h2>
  
  <!-- Ações Rápidas -->
  <div style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
   <button onclick="sincronizarHospedesReservas()">🔄 Sincronizar Hóspedes</button>
   <button onclick="gerarRelatorio()">📊 Atualizar Relatório</button>
  </div>

  <!-- Filtros do Relatório -->
  <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
   <select id="filtroCasaRelatorio" onchange="gerarRelatorio()">
    <option value="todas">Todas as Casas</option>
    <option value="casa1">Casa 1</option>
    <option value="casa2">Casa 2</option>
   </select>
   <select id="filtroPeriodoRelatorio" onchange="gerarRelatorio()">
    <option value="todos">Todo o Período</option>
    <option value="hoje">Hoje</option>
    <option value="mes">Este Mês</option>
   </select>
   <select id="filtroStatusRelatorio" onchange="gerarRelatorio()">
    <option value="todos">Todos os Status</option>
    <option value="pago">Pago Total</option>
    <option value="parcial">Parcial</option>
    <option value="pendente">Pendente</option>
   </select>
   <input type="text" id="filtroHospedeRelatorio" placeholder="Buscar hóspede..." oninput="gerarRelatorio()" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
   <input type="date" id="relatorioDataInicial" onchange="gerarRelatorio()" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
   <input type="date" id="relatorioDataFinal" onchange="gerarRelatorio()" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
  </div>

  <div id="relatorioConteudo"></div>

  <!-- Lista de Hóspedes -->
  <h2 style="margin-top: 35px;">Base de Hóspedes Cadastrados</h2>
  <input type="text" id="buscarHospede" placeholder="Buscar hóspede por nome ou telefone..." oninput="filtrarHospedes()" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px;">
  <div id="listaHospedes"></div>
 </div>
</div>

<!-- MODAL DE EDIÇÃO DA RESERVA (ADMIN) -->
<div id="modalEditarReserva" class="modal">
 <div class="modal-conteudo">
  <h2>Editar Reserva</h2>
  <div id="conteudoEditar"></div>
  <button onclick="fecharModalEditar()" style="margin-top: 15px; background: var(--cinza); width: 100%;">Fechar</button>
 </div>
</div>

<script>
/* =====================================================
   CONFIGURAÇÃO DO FIREBASE
===================================================== */
const firebaseConfig = {
 apiKey: "SUA_API_KEY",
 authDomain: "SEU_PROJETO.firebaseapp.com",
 projectId: "SEU_PROJETO",
 storageBucket: "SEU_PROJETO.appspot.com",
 messagingSenderId: "123456789",
 appId: "1:123456789:web:abcdef"
};

if (!firebase.apps.length) {
 firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

/* =====================================================
   VARIÁVEIS GLOBAIS E NAVEGAÇÃO
===================================================== */
const $ = id => document.getElementById(id);
let reservasConfirmadas = [];
let hospedesCadastrados = [];
let ultimasReservasFiltradas = [];

const casas = {
 casa1: { nome: 'Casa 1' },
 casa2: { nome: 'Casa 2' }
};

const moeda = v => Number(v||0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dataBr = d => d ? d.split('-').reverse().join('/') : '';
const dataStr = d => d ? d.toISOString().split('T')[0] : '';
const hoje = () => new Date();
const dataLocal = s => s ? new Date(s + 'T00:00:00') : null;
const normalizar = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function mudarAba(aba) {
 document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('ativa'));
 document.querySelectorAll('.aba-conteudo').forEach(c => c.classList.remove('ativa'));
 
 if (aba === 'publico') {
  document.querySelectorAll('.nav-tab')[0].classList.add('ativa');
  $('aba-publico').classList.add('ativa');
 } else {
  document.querySelectorAll('.nav-tab')[1].classList.add('ativa');
  $('aba-admin').classList.add('ativa');
  gerarRelatorio();
  filtrarHospedes();
 }
}

/* =====================================================
   ENVIO DE RESERVA (ÁREA PÚBLICA)
===================================================== */
async function enviarSolicitacaoPublica() {
 const casa = $('pubCasa').value;
 const entrada = $('pubEntrada').value;
 const saida = $('pubSaida').value;
 const nome = $('pubNome').value.trim();
 const telefone = $('pubTelefone').value.trim();

 if (!entrada || !saida || !nome || !telefone) {
  return alert('Preencha todos os campos para solicitar a reserva.');
 }

 try {
  await db.collection('reservas').add({
   casa, entrada, saida, nome, telefone,
   statusPagamento: 'pendente',
   valorTotal: 0,
   valorPago: 0,
   criadoEm: firebase.firestore.FieldValue.serverTimestamp()
  });

  alert('✅ Pedido de reserva enviado com sucesso! Entraremos em contacto para confirmação.');
  $('pubNome').value = '';$('pubTelefone').value = '';
  await carregarReservasConfirmadas();
 } catch(e) {
  console.error(e);
  alert('❌ Erro ao enviar reserva.');
 }
}

/* =====================================================
   GERAÇÃO E ENVIO DE RECIBO COM WHATSAPP
===================================================== */
function gerarReciboHTML(r, nome, pago, pagoExtenso, casa, noites, total, pendente, pendenteExtenso, dataEmissao) {
 const janela = window.open('', '_blank');
 
 const textoWhatsApp = encodeURIComponent(
  `*RECIBO DE PAGAMENTO - CASAS NA PRAIA*\n\n` +
  `Hóspede: ${nome}\n` +
  `Acomodação: ${casa}\n` +
  `Período: ${dataBr(r.entrada)} a ${dataBr(r.saida)} (${noites} diárias)\n` +
  `Valor Pago: ${moeda(pago)}\n` +
  `Saldo Pendente: ${moeda(pendente)}\n\n` +
  `Obrigado pela preferência! 🏖️`
 );

 janela.document.write(`
  <!DOCTYPE html>
  <html lang="pt-BR">
  <head>
   <meta charset="UTF-8">
   <title>Recibo de Pagamento - ${nome}</title>
   <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; color: #2c3e50; }
    .recibo-container { max-width: 700px; margin: 0 auto; background: #fff; padding: 35px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); border: 1px solid #e1e8ed; }
    .recibo-cabecalho { text-align: center; border-bottom: 2px solid #0a4b6e; padding-bottom: 15px; margin-bottom: 25px; }
    .recibo-cabecalho h1 { margin: 0; color: #0a4b6e; font-size: 26px; }
    .recibo-cabecalho p { margin: 5px 0 0; color: #7f8c8d; font-size: 14px; }
    .recibo-numero { float: right; font-size: 14px; font-weight: bold; color: #17a2b8; }
    .recibo-corpo { font-size: 15px; line-height: 1.8; margin-bottom: 25px; }
    .recibo-valor-box { background: #e8f5e9; border-left: 5px solid #28a745; padding: 15px; margin: 20px 0; border-radius: 4px; }
    .recibo-valor-box strong { font-size: 20px; color: #155724; }
    .detalhes-tabela { width: 100%; border-collapse: collapse; margin: 20px 0; }
    .detalhes-tabela th, .detalhes-tabela td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
    .detalhes-tabela th { background-color: #f8fafb; color: #0a4b6e; }
    .recibo-rodape { margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; text-align: center; }
    .assinatura-linha { width: 250px; border-top: 1px solid #2c3e50; margin: 50px auto 10px auto; }
    .botoes-impressao { text-align: center; margin-top: 25px; display: flex; gap: 10px; justify-content: center; }
    .btn-imprimir { background: #0a4b6e; color: #fff; border: 0; padding: 12px 20px; border-radius: 6px; font-size: 15px; cursor: pointer; }
    .btn-whats { background: #25d366; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-size: 15px; font-weight: bold; display: inline-block; }
    @media print {
     body { background: #fff; padding: 0; }
     .recibo-container { box-shadow: none; border: none; width: 100%; }
     .botoes-impressao { display: none; }
    }
   </style>
  </head>
  <body>
   <div class="recibo-container">
    <div class="recibo-cabecalho">
     <span class="recibo-numero">Nº Ref: ${r.id.substring(0, 8)}</span>
     <h1>🏖️ Casas na Praia</h1>
     <p>Balneário Arroio do Silva / SC</p>
    </div>
    <div class="recibo-corpo">
     <p><strong>RECIBO DE PAGAMENTO</strong></p>
     <div class="recibo-valor-box">
      Recebemos de <strong>${nome}</strong> a quantia de <strong>${moeda(pago)}</strong> (${pagoExtenso}).
     </div>
     <p>Referente à reserva de hospedagem na <strong>${casa}</strong> para o período de <strong>${dataBr(r.entrada)}</strong> a <strong>${dataBr(r.saida)}</strong> (${noites} diária(s)).</p>
     <table class="detalhes-tabela">
      <tr><th>Resumo Financeiro</th><th>Valor</th></tr>
      <tr><td>Valor Total da Reserva</td><td>${moeda(total)}</td></tr>
      <tr><td><strong>Valor Pago nesta data</strong></td><td><strong>${moeda(pago)}</strong></td></tr>
      <tr><td>Saldo Restante A Receber</td><td>${moeda(pendente)} ${pendente > 0 ? `(${pendenteExtenso})` : '(Quitado)'}</td></tr>
     </table>
     <p>Emissão: ${dataEmissao}</p>
    </div>
    <div class="recibo-rodape">
     <div class="assinatura-linha"></div>
     <p><strong>Casas na Praia — Balneário Arroio do Silva/SC</strong></p>
    </div>
    <div class="botoes-impressao">
     <button class="btn-imprimir" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
     <a href="https://wa.me/55${(r.telefone||'').replace(/\D/g,'')}?text=${textoWhatsApp}" target="_blank" class="btn-whats">📲 Enviar no WhatsApp</a>
    </div>
   </div>
  </body>
  </html>
 `);
 janela.document.close();
}

/* =====================================================
   GERENCIAMENTO E EDIÇÃO DE RESERVAS (ADMIN)
===================================================== */
async function carregarReservasConfirmadas() {
 reservasConfirmadas = [];
 try {
  const s = await db.collection('reservas').get();
  s.forEach(d => reservasConfirmadas.push({ id: d.id, ...d.data() }));
  gerarRelatorio();
 } catch(e) {
  console.error('Erro ao carregar reservas:', e);
 }
}

function abrirEditarReserva(id){
 const r=reservasConfirmadas.find(x=>x.id===id);
 if(!r) return alert('❌ Reserva não encontrada.');

 const total=Number(r.valorTotal||0);
 const pago=Number(r.valorPago||0);

 const h=`
  <div class="grupo-input">
   <label>Status do Pagamento</label>
   <select id="editStatus">
    <option value="pendente" ${r.statusPagamento==='pendente'?'selected':''}>Pendente</option>
    <option value="confirmada" ${r.statusPagamento==='confirmada'?'selected':''}>Confirmada</option>
    <option value="parcial" ${r.statusPagamento==='parcial'?'selected':''}>Parcial</option>
    <option value="pago" ${r.statusPagamento==='pago'?'selected':''}>Pago Total</option>
   </select>
  </div>
  <div class="grupo-input">
   <label>Valor Total (R$)</label>
   <input type="number" id="editValorTotal" value="${total}" step="10" min="0">
  </div>
  <div class="grupo-input">
   <label>Valor Já Pago (R$)</label>
   <input type="number" id="editValorPago" value="${pago}" step="10" min="0">
  </div>
  <div class="grupo-input">
   <label>Observações Internas</label>
   <textarea id="editObs" rows="3">${r.observacao||''}</textarea>
  </div>
  <div class="linha-form" style="margin-top:20px">
   <button id="btnSalvarReserva" class="sucesso" onclick="salvarEdicaoReserva('${r.id}')">💾 Salvar Alterações</button>
   <button id="btnExcluirReserva" class="vermelho" onclick="excluirReserva('${r.id}')">🗑️ Excluir Reserva</button>
  </div>
 `;

 $('conteudoEditar').innerHTML=h;
 $('modalEditarReserva').classList.add('aberto');
}

function fecharModalEditar(){
 $('modalEditarReserva').classList.remove('aberto');
}

async function salvarEdicaoReserva(id){
 const btn = $('btnSalvarReserva');
 if (btn) { btn.disabled = true; btn.innerText = '⏳ Salvando...'; }

 const status = $('editStatus').value;
 const total = Number($('editValorTotal').value||0);
 const pago = Number($('editValorPago').value||0);
 const obs = $('editObs').value.trim();

 const r = reservasConfirmadas.find(x=>x.id===id);
 if(!r) return;

 let novoStatus = status;
 if(pago >= total && total > 0){ novoStatus = 'pago'; }
 else if(pago > 0 && pago < total){ novoStatus = 'parcial'; }

 try {
  await db.collection('reservas').doc(id).update({
   statusPagamento: novoStatus,
   valorTotal: total,
   valorPago: pago,
   observacao: obs,
   atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
  });

  await carregarReservasConfirmadas();
  fecharModalEditar();
  alert('✅ Reserva atualizada!');
 } catch(e) {
  console.error(e);
  alert('❌ Erro ao atualizar reserva.');
 } finally {
  if (btn) { btn.disabled = false; btn.innerText = '💾 Salvar Alterações'; }
 }
}

async function excluirReserva(id){
 if(!confirm('⚠️ Tem certeza que deseja excluir esta reserva permanentemente?')) return;

 const btn = $('btnExcluirReserva');
 if (btn) { btn.disabled = true; btn.innerText = '⏳ Excluindo...'; }

 try {
  await db.collection('reservas').doc(id).delete();
  await carregarReservasConfirmadas();
  fecharModalEditar();
  alert('🗑️ Reserva excluída!');
 } catch(e) {
  console.error(e);
  alert('❌ Erro ao excluir reserva.');
 } finally {
  if (btn) { btn.disabled = false; btn.innerText = '🗑️ Excluir Reserva'; }
 }
}

/* =====================================================
   GERENCIAMENTO DE HÓSPEDES (ADMIN)
===================================================== */
async function carregarHospedes(){
 hospedesCadastrados = [];
 try {
  const s = await db.collection('hospedes').get();
  s.forEach(d => hospedesCadastrados.push({id: d.id, ...d.data()}));
  filtrarHospedes();
 } catch(e) {
  console.error('Erro hóspedes:', e);
 }
}

async function sincronizarHospedesReservas(){
 if(!reservasConfirmadas.length) return alert('Nenhuma reserva para sincronizar.');
 
 const batch = db.batch();
 let novosCount = 0;

 for(const r of reservasConfirmadas){
  if(r.nome && r.telefone){
   const normTel = r.telefone.replace(/\D/g,'');
   const existente = hospedesCadastrados.find(x=>(x.telefone||'').replace(/\D/g,'')===normTel);

   if(!existente){
    const docRef = db.collection('hospedes').doc();
    batch.set(docRef, {
     nome: r.nome,
     telefone: r.telefone,
     criadoEm: firebase.firestore.FieldValue.serverTimestamp()
    });
    novosCount++;
   }
  }
 }

 try {
  if(novosCount > 0){
   await batch.commit();
   await carregarHospedes();
   alert(`🔄 Sincronização concluída! ${novosCount} novo(s) hóspede(s) adicionado(s).`);
  } else {
   alert('ℹ️ Todos os hóspedes das reservas já estão cadastrados.');
  }
 } catch(e) {
  console.error('Erro ao sincronizar:', e);
  alert('❌ Erro ao sincronizar os hóspedes.');
 }
}

function filtrarHospedes(){
 const c = $('listaHospedes');
 if(!c) return;

 const busca = normalizar($('buscarHospede')?.value||'');
 const lista = hospedesCadastrados.filter(h =>
  normalizar(h.nome).includes(busca) || normalizar(h.telefone).includes(busca)
 );

 if(!lista.length){
  c.innerHTML = '<p style="color:var(--cinza);margin-top:10px">Nenhum hóspede encontrado.</p>';
  return;
 }

 c.innerHTML = `
  <table class="tabela-relatorio">

/* =====================================================
   RELATÓRIOS E EXPORTAÇÃO CSV (ADMIN)
===================================================== */
function gerarRelatorio(){
 const container = $('relatorioConteudo');
 if(!container) return;

 const fCasa = $('filtroCasaRelatorio').value;
 const fPeriodo = $('filtroPeriodoRelatorio').value;
 const fStatus = $('filtroStatusRelatorio').value;
 const fHospede = normalizar($('filtroHospedeRelatorio').value);
 const dIni = $('relatorioDataInicial').value;
 const dFim = $('relatorioDataFinal').value;

 let filtradas = [...reservasConfirmadas];

 if(fCasa !== 'todas') filtradas = filtradas.filter(r => r.casa === fCasa);
 if(fStatus !== 'todos') filtradas = filtradas.filter(r => r.statusPagamento === fStatus);
 if(fHospede){
  filtradas = filtradas.filter(r =>
   normalizar(r.nome).includes(fHospede) || normalizar(r.telefone).includes(fHospede)
  );
 }

 const hj = hoje();
 if(fPeriodo === 'hoje'){
  const sHj = dataStr(hj);
  filtradas = filtradas.filter(r => r.entrada <= sHj && r.saida >= sHj);
 } else if(fPeriodo === 'mes'){
  const m = hj.getMonth();
  const y = hj.getFullYear();
  filtradas = filtradas.filter(r => {
   const d = dataLocal(r.entrada);
   return d && d.getMonth() === m && d.getFullYear() === y;
  });
 } else if(fPeriodo === 'personalizado' && dIni && dFim){
  filtradas = filtradas.filter(r => r.entrada >= dIni && r.saida <= dFim);
 }

 ultimasReservasFiltradas = filtradas;

 let totalFaturado = 0, totalPago = 0, totalPendente = 0;

 filtradas.forEach(r => {
  const t = Number(r.valorTotal||0);
  const p = Number(r.valorPago||0);
  totalFaturado += t;
  totalPago += p;
  totalPendente += Math.max(0, t - p);
 });

 container.innerHTML = `
  <div style="text-align:right; margin-bottom:15px;">
   <button onclick="exportarRelatorioCSV()" style="background:#28a745;">📊 Exportar Excel / CSV</button>
  </div>
  <div class="relatorio-resumo">
   <div class="resumo-card"><small>Total de Reservas</small><strong>${filtradas.length}</strong></div>
   <div class="resumo-card"><small>Faturamento Total</small><strong>${moeda(totalFaturado)}</strong></div>
   <div class="resumo-card"><small>Total Recebido</small><strong style="color:var(--sucesso)">${moeda(totalPago)}</strong></div>
   <div class="resumo-card"><small>A Receber</small><strong style="color:var(--perigo)">${moeda(totalPendente)}</strong></div>
  </div>
  <table class="tabela-relatorio">
   <thead>
    <tr>
     <th>Casa</th><th>Hóspede</th><th>Período</th><th>Status</th><th>Total</th><th>Pago</th><th>Ações</th>
    </tr>
   </thead>
   <tbody>
    ${filtradas.length ? filtradas.map(r => {
     const t = Number(r.valorTotal||0);
     const p = Number(r.valorPago||0);
     return `
      <tr>
       <td>${casas[r.casa]?.nome||r.casa}</td>
       <td><strong>${r.nome}</strong><br><small>${r.telefone}</small></td>
       <td>${dataBr(r.entrada)} a${dataBr(r.saida)}</td>
       <td><span class="status-badge status-${r.statusPagamento}">${(r.statusPagamento||'').toUpperCase()}</span></td>
       <td>${moeda(t)}</td>
       <td>${moeda(p)}</td>
       <td>
        <button onclick="abrirEditarReserva('${r.id}')" style="padding:4px 8px; font-size:12px;">✏️ Editar</button>
       </td>
      </tr>
     `;
    }).join('') : '<tr><td colspan="7" style="text-align:center">Nenhuma reserva encontrada.</td></tr>'}
   </tbody>
  </table>
 `;
}

function exportarRelatorioCSV(){
 if(!ultimasReservasFiltradas.length) return alert('Nenhum dado para exportar.');

 let csv = 'Casa;Hospede;Telefone;Entrada;Saida;Status;Total;Pago;Pendente\n';
 ultimasReservasFiltradas.forEach(r => {
  const t = Number(r.valorTotal||0);
  const p = Number(r.valorPago||0);
  const pend = Math.max(0, t - p);
  csv += `"${casas[r.casa]?.nome||r.casa}";"${r.nome}";"${r.telefone}";"${dataBr(r.entrada)}";"${dataBr(r.saida)}";"${r.statusPagamento}";"${t.toFixed(2)}";"${p.toFixed(2)}";"${pend.toFixed(2)}"\n`;
 });

 const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
 const url = URL.createObjectURL(blob);
 const link = document.createElement("a");
 link.setAttribute("href", url);
 link.setAttribute("download", `relatorio_reservas_${dataStr(hoje())}.csv`);
 document.body.appendChild(link);
 link.click();
 document.body.removeChild(link);
}

// Inicialização ao carregar a página
window.onload = () => {
 carregarReservasConfirmadas();
 carregarHospedes();
};
</script>
