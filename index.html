<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casas na Praia - Disponibilidade e Reservas</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{--marinho:#0a4b6e;--marinho2:#063b57;--turquesa:#17a2b8;--ouro:#ffc107;--areia:#f8f5e6;--texto:#2c3e50;--cinza:#7f8c8d;--sucesso:#28a745;--perigo:#dc3545;--branco:#fff;--sombra:0 8px 25px rgba(0,0,0,.10);--forte:0 15px 40px rgba(0,0,0,.18)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:linear-gradient(120deg,#e0f0f5,#fef9ed);color:var(--texto);min-height:100vh}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.azul,.sucesso,.vermelho,.amarelo,.cinza{border:0;padding:10px 15px;border-radius:6px;font-size:14px;transition:.2s}
.azul{background:var(--marinho);color:#fff}
.azul:hover{background:var(--marinho2)}
.sucesso{background:var(--sucesso);color:#fff}
.vermelho{background:var(--perigo);color:#fff}
.amarelo{background:var(--ouro);color:#222}
.cinza{background:#6c757d!important;color:#fff!important}
.oculto{display:none!important}
.pagina{display:none}
.pagina.ativa{display:block}
.ativo{background:var(--ouro)!important;color:#222!important}
.cabecalho-publico{position:absolute;top:0;left:0;right:0;z-index:50;padding:20px 35px;display:flex;justify-content:space-between;align-items:center;color:#fff;background:linear-gradient(180deg,rgba(0,35,55,.82),rgba(0,35,55,.2));backdrop-filter:blur(4px)}
.cabecalho-publico h1{font-size:22px;text-shadow:0 2px 5px #0006}
.botao-login{background:#ffffff29;color:#fff;border:1px solid #ffffff73;padding:11px 20px;border-radius:25px}
.hero-praia{min-height:650px;height:78vh;max-height:800px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;position:relative;background:linear-gradient(180deg,#002d461f,#002337b8),url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2200&q=90");background-size:cover;background-position:center}
.hero-conteudo{max-width:850px;padding:30px;animation:hero .8s ease}
@keyframes hero{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.hero-icone{font-size:60px}
.hero-conteudo h1{font-size:clamp(44px,7vw,78px);line-height:1}
.hero-conteudo h2{font-size:clamp(23px,4vw,38px);font-weight:400;margin:15px 0}
.hero-conteudo p{font-size:18px;line-height:1.6;margin-bottom:25px}
.hero-botao{border:0;background:var(--ouro);padding:15px 30px;border-radius:30px;font-weight:bold}
.area-publica{padding:65px 35px 70px;max-width:1400px;margin:auto;background:#fff}
.introducao-publica{text-align:center;max-width:800px;margin:auto}
.selo-praia{display:inline-block;background:#e6f7fa;color:#0e8196;padding:8px 16px;border-radius:25px;font-size:12px;font-weight:bold}
.introducao-publica h2{color:var(--marinho);font-size:36px;margin:10px 0}
.introducao-publica p{color:var(--cinza);line-height:1.6}
.grade-casas{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;margin-top:30px}
.card-casa{background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--sombra);border:1px solid #0000000d}
.card-imagem{height:250px;background:linear-gradient(135deg,#17a2b8,#0a4b6e);display:flex;align-items:center;justify-content:center;color:#fff;font-size:55px;overflow:hidden}
.card-imagem img{width:100%;height:100%;object-fit:cover}
.card-corpo{padding:22px}
.card-corpo h3{color:var(--marinho);font-size:24px}
.descricao-casa{color:var(--cinza);margin:8px 0 15px;line-height:1.5}
.caracteristicas-casa{display:grid;gap:7px}
.caracteristica-item{background:#f7fafb;border-left:3px solid var(--turquesa);padding:9px;border-radius:8px}
.capacidade{background:#e8f5e9;color:#176b2c;padding:9px;border-radius:8px;margin:10px 0;font-weight:600}
.botao-galeria{width:100%;margin:8px 0;padding:11px;border:0;border-radius:8px;background:var(--marinho);color:#fff}
.aviso-bloqueio{color:var(--perigo);background:#fde8e8;padding:10px;border-radius:6px;margin:10px 0;display:none}
.aviso-capacidade{background:#fff3cd;color:#856404;padding:10px;border-radius:6px}
.aviso-excesso{background:#fde8e8;color:#842029;padding:10px;border-radius:6px;font-weight:600}
.faixa-praia{min-height:330px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:linear-gradient(#00374d4d,#002337a6),url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1800&q=85");background-size:cover;background-position:center}
.faixa-praia-conteudo{max-width:800px;padding:40px;text-shadow:0 3px 8px #0008}
.faixa-praia h2{font-size:clamp(28px,5vw,44px)}
.faixa-praia p{font-size:17px;line-height:1.6;margin-top:10px}
.info-praia{padding:55px 25px;background:#f7fbfc;text-align:center}
.info-praia h2{color:var(--marinho);margin-bottom:30px}
.info-blocos{max-width:1050px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.info-bloco{background:#fff;padding:25px 20px;border-radius:15px;box-shadow:0 5px 18px #0000000f}
.info-bloco .icone{font-size:38px}
.info-bloco h3{color:var(--marinho);margin:8px}
.info-bloco p{color:var(--cinza);font-size:14px;line-height:1.5}
.rodape-publico{background:linear-gradient(90deg,var(--marinho2),var(--marinho));color:#fff;padding:30px;text-align:center}
.rodape-publico p{font-size:13px;margin-top:5px;color:#ffffffd1}
.overlay-galeria,.overlay-login,.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.25s;z-index:200}
.overlay-galeria.aberto,.overlay-login.aberto,.modal.aberto{opacity:1;visibility:visible}
.overlay-galeria{background:#000e;z-index:400}
.galeria-conteudo{width:95%;max-width:900px;position:relative}
.galeria-foto-principal{width:100%;height:70vh;object-fit:contain;background:#000}
.galeria-navegacao{display:flex;justify-content:space-between;color:#fff;margin-top:10px}
.galeria-botao-nav{background:#fff3;color:#fff;border:0;padding:10px 18px;border-radius:6px}
.galeria-miniaturas{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
.miniatura{width:80px;height:60px;object-fit:cover;border:2px solid transparent}
.miniatura.ativa{border-color:var(--ouro)}
.fechar-galeria{position:absolute;right:0;top:-40px;background:none;border:0;color:#fff;font-size:30px}
.overlay-login,.modal{background:#0008}
.caixa-login,.modal-conteudo{background:#fff;padding:25px;border-radius:12px;box-shadow:var(--sombra);width:92%;max-width:650px;max-height:92vh;overflow-y:auto}
.caixa-login{max-width:340px}
.caixa-login h2{text-align:center;color:var(--marinho);margin-bottom:25px}
.grupo-input{margin-bottom:15px}
.grupo-input label{display:block;margin-bottom:5px;font-weight:600;font-size:14px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px}
</style>
</head>
<body>
</body>
</html>
