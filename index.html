<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <title>Gestão - Casas na Praia</title>
</head>
<body>

<script>
/* =====================================================
   IMPRESSÃO E ENVIO DE RECIBO
===================================================== */

function gerarReciboHTML(r, nome, pago, pagoExtenso, casa, noites, total, pendente, pendenteExtenso, dataEmissao) {
 const janela = window.open('', '_blank');
 
 const textoWhatsApp = encodeURIComponent(
  `*RECIBO DE PAGAMENTO - CASAS NA PRAIA*\n\n` +
  `Hóspede: ${nome}\n` +
  `Acomodação: ${casa}\n` +
  `Período: ${dataBr(r.entrada)} a ${dataBr(r.saida)} (${noites} diárias)\n` +
  `Valor Pago: ${moeda(pago)}\n` +
  `Saldo Pendente: ${moeda(pendente)}\n\n` +
  `Obrigado pela preferência! 🏖️`
 );

 janela.document.write(`
  <!DOCTYPE html>
  <html lang="pt-BR">
  <head>
   <meta charset="UTF-8">
   <title>Recibo de Pagamento - ${nome}</title>
   <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; color: #2c3e50; }
    .recibo-container { max-width: 700px; margin: 0 auto; background: #fff; padding: 35px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); border: 1px solid #e1e8ed; }
    .recibo-cabecalho { text-align: center; border-bottom: 2px solid #0a4b6e; padding-bottom: 15px; margin-bottom: 25px; }
    .recibo-cabecalho h1 { margin: 0; color: #0a4b6e; font-size: 26px; }
    .recibo-cabecalho p { margin: 5px 0 0; color: #7f8c8d; font-size: 14px; }
    .recibo-numero { float: right; font-size: 14px; font-weight: bold; color: #17a2b8; }
    .recibo-corpo { font-size: 15px; line-height: 1.8; margin-bottom: 25px; }
    .recibo-valor-box { background: #e8f5e9; border-left: 5px solid #28a745; padding: 15px; margin: 20px 0; border-radius: 4px; }
    .recibo-valor-box strong { font-size: 20px; color: #155724; }
    .detalhes-tabela { width: 100%; border-collapse: collapse; margin: 20px 0; }
    .detalhes-tabela th, .detalhes-tabela td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
    .detalhes-tabela th { background-color: #f8fafb; color: #0a4b6e; }
    .recibo-rodape { margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; text-align: center; }
    .assinatura-linha { width: 250px; border-top: 1px solid #2c3e50; margin: 50px auto 10px auto; }
    .botoes-impressao { text-align: center; margin-top: 25px; display: flex; gap: 10px; justify-content: center; }
    .btn-imprimir { background: #0a4b6e; color: #fff; border: 0; padding: 12px 20px; border-radius: 6px; font-size: 15px; cursor: pointer; }
    .btn-whats { background: #25d366; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-size: 15px; font-weight: bold; display: inline-block; }
    @media print {
     body { background: #fff; padding: 0; }
     .recibo-container { box-shadow: none; border: none; width: 100%; }
     .botoes-impressao { display: none; }
    }
   </style>
  </head>
  <body>
   <div class="recibo-container">
    <div class="recibo-cabecalho">
     <span class="recibo-numero">Nº Ref: ${r.id.substring(0, 8)}</span>
     <h1>🏖️ Casas na Praia</h1>
     <p>Balneário Arroio do Silva / SC</p>
    </div>

    <div class="recibo-corpo">
     <p><strong>RECIBO DE PAGAMENTO</strong></p>
     
     <div class="recibo-valor-box">
      Recebemos de <strong>${nome}</strong> a quantia de <strong>${moeda(pago)}</strong> (${pagoExtenso}).
     </div>

     <p>Referente à reserva de hospedagem na <strong>${casa}</strong> para o período de <strong>${dataBr(r.entrada)}</strong> a <strong>${dataBr(r.saida)}</strong> (${noites} diária(s)).</p>

     <table class="detalhes-tabela">
      <tr>
       <th>Resumo Financeiro</th>
       <th>Valor</th>
      </tr>
      <tr>
       <td>Valor Total da Reserva</td>
       <td>${moeda(total)}</td>
      </tr>
      <tr>
       <td><strong>Valor Pago nesta data</strong></td>
       <td><strong>${moeda(pago)}</strong></td>
      </tr>
      <tr>
       <td>Saldo Restante A Receber</td>
       <td>${moeda(pendente)} ${pendente > 0 ? `(${pendenteExtenso})` : '(Quitado)'}</td>
      </tr>
     </table>

     <p>Emissão: ${dataEmissao}</p>
    </div>

    <div class="recibo-rodape">
     <div class="assinatura-linha"></div>
     <p><strong>Casas na Praia — Balneário Arroio do Silva/SC</strong></p>
    </div>

    <div class="botoes-impressao">
     <button class="btn-imprimir" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
     <a href="https://wa.me/55${(r.telefone||'').replace(/\D/g,'')}?text=${textoWhatsApp}" target="_blank" class="btn-whats">📲 Enviar no WhatsApp</a>
    </div>
   </div>
  </body>
  </html>
 `);

 janela.document.close();
}


/* =====================================================
   EDITAR / GERENCIAR RESERVA (PAINEL ADMIN)
===================================================== */

function abrirEditarReserva(id){
 const r=reservasConfirmadas.find(x=>x.id===id);
 if(!r) return alert('❌ Reserva não encontrada.');

 const total=Number(r.valorTotal||0);
 const pago=Number(r.valorPago||0);

 const h=`
  <div class="grupo-input">
   <label>Status do Pagamento</label>
   <select id="editStatus">
    <option value="pendente" ${r.statusPagamento==='pendente'?'selected':''}>Pendente</option>
    <option value="confirmada" ${r.statusPagamento==='confirmada'?'selected':''}>Confirmada</option>
    <option value="parcial" ${r.statusPagamento==='parcial'?'selected':''}>Parcial</option>
    <option value="pago" ${r.statusPagamento==='pago'?'selected':''}>Pago Total</option>
   </select>
  </div>

  <div class="caixa-valores-reserva">
   <div class="linha-valor">
    <span>Valor Diárias:</span>
    <strong>${moeda(r.valorDiarias)}</strong>
   </div>
   <div class="linha-valor">
    <span>Taxa Limpeza:</span>
    <strong>${moeda(r.taxaLimpeza)}</strong>
   </div>
   <div class="linha-valor">
    <span>Acréscimos:</span>
    <strong>+ ${moeda(r.acrescimoValor)}</strong>
   </div>
   <div class="linha-valor">
    <span>Descontos:</span>
    <strong>- ${moeda(r.desconto)}</strong>
   </div>
   <div class="linha-valor total-reserva-destaque">
    <span>Valor Total:</span>
    <strong>${moeda(total)}</strong>
   </div>
  </div>

  <div class="grupo-input">
   <label>Valor Já Pago (R$)</label>
   <input type="number" id="editValorPago" value="${pago}" step="10" min="0">
  </div>

  <div class="acrescimo-box">
   <strong>Aplicar Desconto / Acréscimo Direto</strong>
   <div class="linha-form" style="margin-top:8px">
    <input type="number" id="valAjuste" placeholder="Valor R$" step="10">
    <button type="button" onclick="aplicarAjusteReserva('${r.id}', 'desconto')"> - Desconto</button>
    <button type="button" onclick="aplicarAjusteReserva('${r.id}', 'acrescimo')"> + Acréscimo</button>
   </div>
  </div>

  <div class="grupo-input">
   <label>Observações Internas</label>
   <textarea id="editObs" rows="3">${r.observacao||''}</textarea>
  </div>

  <div class="linha-form" style="margin-top:20px">
   <button id="btnSalvarReserva" class="sucesso" onclick="salvarEdicaoReserva('${r.id}')">💾 Salvar Alterações</button>
   <button id="btnExcluirReserva" class="vermelho" onclick="excluirReserva('${r.id}')">🗑️ Excluir Reserva</button>
  </div>
 `;

 $('conteudoEditar').innerHTML=h;
 $('modalEditarReserva').classList.add('aberto');
}


function fecharModalEditar(){
 $('modalEditarReserva').classList.remove('aberto');
}


async function salvarEdicaoReserva(id){
 const btn = $('btnSalvarReserva');
 if (btn) { btn.disabled = true; btn.innerText = '⏳ Salvando...'; }

 const status=$('editStatus').value;
 const pago=Number($('editValorPago').value||0);
 const obs=$('editObs').value.trim();

 const r=reservasConfirmadas.find(x=>x.id===id);
 if(!r) return;

 const total=Number(r.valorTotal||0);

 let novoStatus=status;
 if(pago>=total && total>0){
  novoStatus='pago';
 } else if(pago>0 && pago<total){
  novoStatus='parcial';
 }

 try{
  await db.collection('reservas').doc(id).update({
   statusPagamento: novoStatus,
   valorPago: pago,
   observacao: obs,
   atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
  });

  await carregarReservasConfirmadas();
  atualizarListaReservas();
  renderizarCalendario();
  gerarRelatorio();

  fecharModalEditar();
  alert('✅ Reserva atualizada!');
 }catch(e){
  console.error(e);
  alert('❌ Erro ao atualizar reserva.');
 } finally {
  if (btn) { btn.disabled = false; btn.innerText = '💾 Salvar Alterações'; }
 }
}


async function aplicarAjusteReserva(id, tipo){
 const val=Number($('valAjuste').value||0);
 if(!val || val<=0) return alert('Informe um valor positivo válido para o ajuste.');

 const r=reservasConfirmadas.find(x=>x.id===id);
 if(!r) return;

 let desc=Number(r.desconto||0);
 let acr=Number(r.acrescimoValor||0);

 if(tipo==='desconto'){
  desc+=val;
 } else {
  acr+=val;
 }

 const subtotal=Number(r.valorDiarias||0)+Number(r.taxaLimpeza||0);
 const novoTotal=Math.max(0, subtotal + acr - desc);

 try{
  await db.collection('reservas').doc(id).update({
   desconto: desc,
   acrescimoValor: acr,
   valorTotal: novoTotal,
   atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
  });

  await carregarReservasConfirmadas();
  abrirEditarReserva(id);
  atualizarListaReservas();
 }catch(e){
  console.error(e);
  alert('❌ Erro ao aplicar ajuste.');
 }
}


async function excluirReserva(id){
 if(!confirm('⚠️ Tem certeza que deseja excluir esta reserva permanentemente?')) return;

 const btn = $('btnExcluirReserva');
 if (btn) { btn.disabled = true; btn.innerText = '⏳ Excluindo...'; }

 try{
  await db.collection('reservas').doc(id).delete();

  await carregarReservasConfirmadas();
  atualizarListaReservas();
  renderizarCalendario();
  gerarRelatorio();

  fecharModalEditar();
  alert('🗑️ Reserva excluída!');
 }catch(e){
  console.error(e);
  alert('❌ Erro ao excluir reserva.');
 } finally {
  if (btn) { btn.disabled = false; btn.innerText = '🗑️ Excluir Reserva'; }
 }
}


/* =====================================================
   CÁLCULOS E REGRAS DE NEGÓCIO
===================================================== */

function calcularValorDiariasLocal(casa, a, b){
 const da=dataLocal(a);
 const ds=dataLocal(b);

 if(!da || !ds || ds<=da) return {dias:0, valor:0};

 let total=0;
 let n=0;

 for(let d=new Date(da); d<ds; d.setDate(d.getDate()+1)){
  const v=valoresDiarias[`${casa}_${dataStr(d)}`];
  total += (v!=null ? Number(v) : 150);
  n++;
 }

 return {dias:n, valor:total};
}


function calcularValorFinalReserva(dias, valorDiarias, taxaLimpeza){
 let percDesconto=0;

 if(dias>=10) percDesconto=10;
 else if(dias>=7) percDesconto=5;

 const desc = (valorDiarias * percDesconto) / 100;
 const total = Math.max(0, (valorDiarias - desc) + taxaLimpeza);

 return {
  percentualDesconto: percDesconto,
  desconto: desc,
  total: total
 };
}


/* =====================================================
   GERENCIAMENTO DE HÓSPEDES (OTIMIZADO)
===================================================== */

async function carregarHospedes(){
 hospedesCadastrados=[];
 try{
  const s=await db.collection('hospedes').get();
  s.forEach(d=>hospedesCadastrados.push({id:d.id, ...d.data()}));
 }catch(e){
  console.error('Erro hóspedes:', e);
 }
}


async function sincronizarHospedesReservas(){
 if(!reservasConfirmadas.length) return alert('Nenhuma reserva para sincronizar.');
 
 const batch = db.batch();
 let novosCount = 0;

 for(const r of reservasConfirmadas){
  if(r.nome && r.telefone){
   const normTel = r.telefone.replace(/\D/g,'');
   const existente = hospedesCadastrados.find(x=>(x.telefone||'').replace(/\D/g,'')===normTel);

   if(!existente){
    const docRef = db.collection('hospedes').doc();
    batch.set(docRef, {
     nome: r.nome,
     telefone: r.telefone,
     criadoEm: firebase.firestore.FieldValue.serverTimestamp()
    });
    novosCount++;
   }
  }
 }

 try {
  if(novosCount > 0){
   await batch.commit();
   await carregarHospedes();
   filtrarHospedes();
   alert(`🔄 Sincronização concluída! ${novosCount} novo(s) hóspede(s) adicionado(s).`);
  } else {
   alert('ℹ️ Todos os hóspedes das reservas já estão cadastrados.');
  }
 } catch(e) {
  console.error('Erro ao sincronizar em lote:', e);
  alert('❌ Ocorreu um erro ao sincronizar os hóspedes.');
 }
}


function filtrarHospedes(){
 const c=$('listaHospedes');
 if(!c) return;

 const busca=normalizar($('buscarHospede')?.value||'');

 const lista=hospedesCadastrados.filter(h=>
  normalizar(h.nome).includes(busca) || normalizar(h.telefone).includes(busca)
 );

 if(!lista.length){
  c.innerHTML='<p style="color:var(--cinza);margin-top:10px">Nenhum hóspede encontrado.</p>';
  return;
 }

 c.innerHTML=`
  <table class="tabela-relatorio">
   <thead>
    <tr>
     <th>Nome</th>
     <th>Telefone / WhatsApp</th>
     <th>Ações</th>
    </tr>
   </thead>
   <tbody>
    ${lista.map(h=>`
     <tr>
      <td><strong>${h.nome}</strong></td>
      <td>${h.telefone}</td>
      <td>
       <a href="https://wa.me/55${h.telefone.replace(/\D/g,'')}" target="_blank" class="link-whatsapp-publico" style="padding:4px 10px;font-size:12px">
        📱 Conversar
       </a>
      </td>
     </tr>
    `).join('')}
   </tbody>
  </table>
 `;
}


/* =====================================================
   RELATÓRIOS E EXPORTAÇÃO CSV
===================================================== */

let ultimasReservasFiltradas = [];

function gerarRelatorio(){
 const container=$('relatorioConteudo');
 if(!container) return;

 const fCasa=$('filtroCasaRelatorio').value;
 const fPeriodo=$('filtroPeriodoRelatorio').value;
 const fStatus=$('filtroStatusRelatorio').value;
 const fHospede=normalizar($('filtroHospedeRelatorio').value);
 const dIni=$('relatorioDataInicial').value;
 const dFim=$('relatorioDataFinal').value;

 let filtradas=[...reservasConfirmadas];

 if(fCasa!=='todas') filtradas=filtradas.filter(r=>r.casa===fCasa);
 if(fStatus!=='todos') filtradas=filtradas.filter(r=>r.statusPagamento===fStatus);
 if(fHospede){
  filtradas=filtradas.filter(r=>
   normalizar(r.nome).includes(fHospede) || normalizar(r.telefone).includes(fHospede)
  );
 }

 const hj=hoje();
 if(fPeriodo==='hoje'){
  const sHj=dataStr(hj);
  filtradas=filtradas.filter(r=>r.entrada<=sHj && r.saida>=sHj);
 } else if(fPeriodo==='mes'){
  const m=hj.getMonth();
  const y=hj.getFullYear();
  filtradas=filtradas.filter(r=>{
   const d=dataLocal(r.entrada);
   return d && d.getMonth()===m && d.getFullYear()===y;
  });
 } else if(fPeriodo==='personalizado' && dIni && dFim){
  filtradas=filtradas.filter(r=>r.entrada>=dIni && r.saida<=dFim);
 }

 ultimasReservasFiltradas = filtradas;

 let totalFaturado=0, totalPago=0, totalPendente=0;

 filtradas.forEach(r=>{
  const t=Number(r.valorTotal||0);
  const p=Number(r.valorPago||0);
  totalFaturado+=t;
  totalPago+=p;
  totalPendente+=Math.max(0, t-p);
 });

 container.innerHTML=`
  <div style="text-align:right; margin-bottom:15px;">
   <button onclick="exportarRelatorioCSV()" style="background:#28a745; color:#fff; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">
    📊 Exportar Excel / CSV
   </button>
  </div>

  <div class="relatorio-resumo">
   <div class="resumo-card">
    <small>Total de Reservas</small>
    <strong>${filtradas.length}</strong>
   </div>
   <div class="resumo-card">
    <small>Faturamento Total</small>
    <strong>${moeda(totalFaturado)}</strong>
   </div>
   <div class="resumo-card">
    <small>Total Recebido</small>
    <strong style="color:var(--sucesso)">${moeda(totalPago)}</strong>
   </div>
   <div class="resumo-card">
    <small>A Receber</small>
    <strong style="color:var(--perigo)">${moeda(totalPendente)}</strong>
   </div>
  </div>

  <table class="tabela-relatorio">
   <thead>
    <tr>
     <th>Casa</th>
     <th>Hóspede</th>
     <th>Período</th>
     <th>Status</th>
     <th>Total</th>
     <th>Pago</th>
     <th>A Receber</th>
    </tr>
   </thead>
   <tbody>
    ${filtradas.length ? filtradas.map(r=>{
     const t=Number(r.valorTotal||0);
     const p=Number(r.valorPago||0);
     return `
      <tr>
       <td>${casas[r.casa]?.nome||r.casa}</td>
       <td><strong>${r.nome}</strong><br><small>${r.telefone}</small></td>
       <td>${dataBr(r.entrada)} a${dataBr(r.saida)}</td>
       <td><span class="status-badge status-${r.statusPagamento}">${(r.statusPagamento||'').toUpperCase()}</span></td>
       <td>${moeda(t)}</td>
       <td>${moeda(p)}</td>
       <td>${moeda(Math.max(0, t-p))}</td>
      </tr>
     `;
    }).join('') : '<tr><td colspan="7" style="text-align:center">Nenhuma reserva encontrada para os filtros selecionados.</td></tr>'}
   </tbody>
  </table>
 `;
}


function exportarRelatorioCSV(){
 if(!ultimasReservasFiltradas.length) return alert('Nenhum dado para exportar.');

 let csv = 'Casa;Hospede;Telefone;Entrada;Saida;Status;Total;Pago;Pendente\n';

 ultimasReservasFiltradas.forEach(r=>{
  const t=Number(r.valorTotal||0);
  const p=Number(r.valorPago||0);
  const pend=Math.max(0, t-p);

  csv += `"${casas[r.casa]?.nome||r.casa}";"${r.nome}";"${r.telefone}";"${dataBr(r.entrada)}";"${dataBr(r.saida)}";"${r.statusPagamento}";"${t.toFixed(2)}";"${p.toFixed(2)}";"${pend.toFixed(2)}"\n`;
 });

 const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
 const url = URL.createObjectURL(blob);
 const link = document.createElement("a");
 link.setAttribute("href", url);
 link.setAttribute("download", `relatorio_reservas_${dataStr(hoje())}.csv`);
 document.body.appendChild(link);
 link.click();
 document.body.removeChild(link);
}

</script>
</body>
</html>
