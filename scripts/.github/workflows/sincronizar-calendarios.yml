name: Sincronizar calendários

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Gravar as alterações? Deixe desmarcado para apenas testar.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sincronizar-calendarios
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependência
        run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - name: Sincronizar
        env:
          ICAL_FEEDS: ${{ secrets.ICAL_FEEDS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APLICAR: ${{ github.event_name == 'workflow_dispatch' && inputs.aplicar || github.event_name == 'schedule' && vars.SINCRONIZACAO_ATIVA == 'true' }}
        run: node scripts/sincronizar-calendarios.mjs
